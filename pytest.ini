[pytest]
testpaths = tests
# Issue #8: um aviso de depreciação ou um recurso por fechar no código do
# projeto é uma falha, não um rodapé que ninguém lê. Os avisos das
# bibliotecas externas continuam visíveis (-rs no CI) mas não fazem falhar a
# corrida, porque não se corrigem aqui e variam com o sistema e a versão.
filterwarnings =
    error::DeprecationWarning:cct.*
    error::DeprecationWarning:tests.*
    error::PendingDeprecationWarning:cct.*
    error::pytest.PytestDeprecationWarning
    error::pytest.PytestUnraisableExceptionWarning
    error::ResourceWarning
