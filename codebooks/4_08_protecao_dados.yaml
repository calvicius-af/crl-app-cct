# Codebook do tema 4.08 — Direitos de Personalidade e Proteção de Dados
# Fonte: livro de códigos do CRL (termos de pesquisa lexical por subcódigo).
# Os ids seguem a forma usada no gabarito MaxQDA (4.08.x.y).
tema: "4.08 Direitos Personalidade e Proteção Dados"
# eixos agregadores: recebem codificação sempre que um subcódigo dispara
eixos: ["4.08.1", "4.08.2", "4.08.3", "4.08.4", "4.08.5", "4.08.6"]
codigos:
  - id: "4.08.1.1"
    nome: "Dignidade, honra e reserva da vida privada"
    termos: [personalidade, dignidade, urbanidade, probidade, vida privada,
             intimidade, honra, integridade, liberdade de expressão, respeito, reserva]
  - id: "4.08.1.2"
    nome: "Proteção de candidatos ao emprego"
    termos: [candidat, recrutamento, seleção]
    condicoes:
      requer_algum: [vida privada, dados pessoais, informações, intimidade]
  - id: "4.08.2.1"
    nome: "Videovigilância e controlo de instalações"
    termos: [vigilância, videovigilância, câmara, câmaras, CCTV, gravação,
             gravações, CNPD, monitorização]
    condicoes:
      requer_algum: [videovigilância, câmara, câmaras, CCTV,
                     vigilância a distância, meios de vigilância, imagem]
      excluir: [comissão de vigilância]
  - id: "4.08.2.2"
    nome: "Georreferenciação e GPS"
    termos: [GPS, geolocalização, georreferenciação, rastreamento, tacógrafo]
  - id: "4.08.3.1"
    nome: "Biométricos: assiduidade e acesso a instalações"
    termos: [biométric, impressão digital, impressões digitais,
             reconhecimento facial, irreversibilidade]
  - id: "4.08.4.1"
    nome: "Confidencialidade de mensagens e regras de utilização"
    termos: [comunicação eletrónica, e-mail, email, correio eletrónico,
             internet, mensagens, sigilo, ferramentas digitais,
             utilização pessoal, BYOD]
    condicoes:
      requer_algum: [eletrónic, e-mail, email, internet, digital, informátic]
  - id: "4.08.4.2"
    nome: "Privacidade no teletrabalho e desconexão"
    termos: [teletrabalho, trabalho remoto, desconexão, pausa digital,
             acompanhamento à distância, contexto pessoal, contexto familiar]
  - id: "4.08.5.1"
    nome: "Registo de pessoal, atualização e consulta"
    # variantes mineradas dos segmentos FN do gabarito (06/07/2026):
    # as convenções usam "registo do pessoal" e "registo dos trabalhadores"
    termos: [processo individual, registo de pessoal, registo do pessoal,
             registo dos trabalhadores, cadastro individual,
             dados do trabalhador, ficheiro, informação pessoal,
             caráter confidencial, carácter confidencial]
  - id: "4.08.5.2"
    nome: "Dados sensíveis e saúde"
    termos: [dados sensíveis, exame médico, exames médicos, alcoolemia,
             estupefacientes, substâncias psicoativas, sigilo médico,
             processo clínico, médico do trabalho, dados genéticos,
             cuidador informal]
    condicoes:
      requer_algum: [dados, confidencial, sigilo, reserva]
  - id: "4.08.5.3"
    nome: "Dados de filiação sindical"
    termos: [filiação sindical, quota sindical, sindicalização]
    condicoes:
      requer_algum: [dados, tratamento, confidencial, declaração individual]
  - id: "4.08.5.4"
    nome: "Confidencialidade: violência doméstica e assédio"
    termos: [violência doméstica, vítima, assédio, denúncia]
    condicoes:
      requer_algum: [confidencial, confidencialidade, reserva, sigilo, privacidade]
  - id: "4.08.5.5"
    nome: "Avaliação de desempenho: confidencialidade"
    termos: [avaliação de desempenho, avaliador, avaliado, processo de avaliação]
    condicoes:
      requer_algum: [confidencial, confidencialidade, sigilo, reserva]
  - id: "4.08.6.1"
    nome: "Gestão algorítmica e IA: transparência"
    termos: [algoritmo, algoritmos, inteligência artificial, decisão automatizada,
             decisões automatizadas, modelos digitais, sistema de IA,
             plataforma digital]
