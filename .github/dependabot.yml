# Actualização automática e revista de dependências (issues #5 e #30).
#
# Duas ecologias: as dependências Python e as próprias GitHub Actions. As
# actions estão fixadas por SHA no workflow; é o Dependabot que propõe o SHA
# seguinte, mantendo o comentário de versão actualizado. Nenhuma actualização
# entra sozinha: tudo passa por pull request e pelos cinco jobs de testes.
version: 2

updates:
  # requirements.txt (mínimos) e pyproject.toml, na raiz.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - security

  # Constraints com versões exactas: runtime, desenvolvimento e Docling.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
      - security
