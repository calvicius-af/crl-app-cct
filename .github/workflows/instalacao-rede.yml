name: Instalação offline em unidade de rede

# ISSUE-0009 (#59): numa estação do CRL, com o projeto numa unidade mapeada
# (L: → \\localhost\C$\...), o instalador offline falhava no pip. A correção
# está no código, mas a matriz de testes não tem unidades de rede e os testes
# de unidade só simulam o caminho. Este workflow reproduz a condição real num
# runner Windows: partilha SMB local, unidade mapeada com `net use`, e o
# pacote offline verdadeiro (preparado aqui, com rede) instalado a partir da
# unidade e a partir do caminho UNC, sem rede para o pip (--no-index).
#
# Limite: o runner não tem a região portuguesa nem as políticas do proxy do
# CRL; o gate na estação continua a ser a confirmação final
# (docs/validacao/instalacao-estacao-crl-2026-09-17.md).

on:
  pull_request:
    paths:
      - scripts/instalar_offline*
      - scripts/preparar_pacote_offline.py
      - requirements.txt
      - requirements/**
      - cct/doctor.py
      - cct/proveniencia.py
      - cct/subprocesso.py
      - .github/workflows/instalacao-rede.yml
  push:
    branches: [main]
    paths:
      - scripts/instalar_offline*
      - scripts/preparar_pacote_offline.py
      - requirements.txt
      - requirements/**
      - .github/workflows/instalacao-rede.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unidade-de-rede:
    name: instalar de L:\ e de \\localhost\ (Windows, Python 3.13)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Preparar o pacote offline (com rede, como na máquina de preparação)
        run: python scripts/preparar_pacote_offline.py --alvos win_amd64:313 --incluir-testes

      - name: Pôr duas cópias do projeto numa partilha SMB local
        run: |
          foreach ($copia in "mapeada", "unc") {
            robocopy $env:GITHUB_WORKSPACE "C:\partilha\$copia" /E /XD .git /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "robocopy falhou ($LASTEXITCODE)" }
          }
          New-SmbShare -Name crl -Path C:\partilha -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          Get-SmbShare -Name crl

      - name: Instalar a partir da unidade mapeada L:\ (o caso da estação)
        # O mapeamento vale para a sessão deste passo: mapear, provar a
        # condição, instalar e verificar tudo aqui.
        run: |
          net use L: \\localhost\crl /persistent:no
          if ($LASTEXITCODE -ne 0) { throw "net use falhou" }

          # A condição do defeito tem de estar presente, ou o teste não prova nada:
          # resolve() sobre a unidade mapeada devolve o caminho UNC.
          python -c "from pathlib import Path; p = Path(r'L:\mapeada\scripts\instalar_offline.py').resolve(); print('resolve():', p); assert str(p).startswith('\\\\'), 'L: não é uma unidade de rede neste runner'"
          if ($LASTEXITCODE -ne 0) { throw "a unidade L: não reproduz a condição do ISSUE-0009" }

          # Como na estação: a partir de L:, pelo .bat (o pause lê do stdin).
          cmd /c "L: && cd \mapeada && echo.| scripts\instalar_offline.bat"
          # O .bat termina no pause; o resultado vê-se no que ficou instalado.
          $py = "L:\mapeada\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "o instalador não criou o .venv em L:" }
          Push-Location L:\mapeada
          & $py -m cct.doctor
          if ($LASTEXITCODE -ne 0) { throw "o doctor encontrou problemas na instalação em L:" }
          & $py -m pytest -q -p no:cacheprovider tests/test_pacote_offline.py tests/test_extractor.py tests/test_doctor.py
          if ($LASTEXITCODE -ne 0) { throw "os testes falham a partir de L:" }
          Pop-Location

      - name: Instalar a partir do caminho UNC \\localhost\crl
        run: |
          python \\localhost\crl\unc\scripts\instalar_offline.py
          if ($LASTEXITCODE -ne 0) { throw "a instalação a partir do caminho UNC falhou" }
          $py = "\\localhost\crl\unc\.venv\Scripts\python.exe"
          & $py -c "import pdfplumber, openpyxl, cct.pipeline_tema; print('ok: bibliotecas e cct carregam do caminho UNC')"
          if ($LASTEXITCODE -ne 0) { throw "as bibliotecas não carregam do caminho UNC" }

      - name: Controlo, só informativo — o --find-links antigo (caminho UNC em texto)
        # A forma anterior à correção: registar se este pip ainda falha com
        # ela ajuda a saber se o defeito era do pip ou do caminho.
        if: always()
        continue-on-error: true
        run: |
          python -m venv C:\controlo
          C:\controlo\Scripts\python.exe -m pip install --no-index --find-links \\localhost\crl\unc\vendor\wheels pdfplumber
          "pip com --find-links em caminho UNC: código $LASTEXITCODE (0 = este pip já não perde o servidor)"
