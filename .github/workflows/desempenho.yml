name: Desempenho

# Medida agendada de desempenho dos extratores (#26): mede o corpus de
# regressão com `python -m cct.desempenho` e falha quando os segundos por
# página ou a memória passam a referência deste ambiente mais 15%. O orçamento
# absoluto (tests/desempenho/referencia.json) só trava quando o seu estado for
# «aprovado»; enquanto for «proposta», é mostrado e não falha. Agendado, e não em cada PR: os
# tempos de uma máquina partilhada variam, e uma semana de margem chega para
# apanhar uma regressão sem bloquear quem trabalha.
on:
  schedule:
    - cron: "17 5 * * 1"      # segundas-feiras, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdfplumber:
    name: desempenho do pdfplumber (corpus)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c requirements/runtime.txt -c requirements/dev.txt

      - name: Obter os PDF do corpus
        run: python -m cct.corpus obter --rede

      - name: Medir e comparar com a referência e o orçamento
        run: python -m cct.desempenho medir --comparar

      - name: Guardar as medidas
        # para criar a referência deste ambiente: copiar o agregado para
        # tests/desempenho/referencia.json (ou correr --atualizar no mesmo ambiente)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desempenho
          path: results/desempenho/
          if-no-files-found: ignore
