name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Correr os testes
        # Os testes que precisam dos dados (fora do repositório) declaram-se
        # como skipped; ver CONTRIBUTING.md.
        run: python -m pytest -q -rs

      - name: Verificar anonimização dos exemplos
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/anonimizar_exemplos.py --check

      - name: Verificar que não entraram dados no repositório
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          fugas=$(git ls-files | grep -iE '\.(pdf|qdpx|mqda|xlsx|qdc)$' \
                  | grep -vE '^(examples|tests)/' || true)
          if [ -n "$fugas" ]; then
            echo "Ficheiros de dados versionados fora de examples/ e tests/:"
            echo "$fugas"
            exit 1
          fi
          echo "OK — nenhum ficheiro de dados fora do sítio."

  tipos-docling:
    # O extrator docling é opcional e a suite normal corre sem ele (os
    # testes usam objetos de teste). Este job instala só os TIPOS
    # (docling-core, sem PyTorch) para confirmar que a forma real deles
    # não mudou — ver tests/test_docling_integracao.py.
    name: tipos docling (docling-core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências + tipos do docling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install docling-core

      - name: Correr os testes
        run: python -m pytest -q -rs
